name: Build AVORA release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        run: |
          if [ -f project.zip ]; then
            mkdir -p _src
            unzip -oq project.zip -d _src
            echo "PROJECT_DIR=_src" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Check no key files in the project
        run: |
          if find "$PROJECT_DIR" -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) | grep -q .; then
            echo "::error::A key file is inside the project. Remove it; the key must only live in GitHub Secrets."
            exit 1
          fi

      - name: Prepare signing key from GitHub Secrets
        env:
          AVORA_KEYSTORE_BASE64: ${{ secrets.AVORA_KEYSTORE_BASE64 }}
          AVORA_KEYSTORE_PASSWORD: ${{ secrets.AVORA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$AVORA_KEYSTORE_BASE64" ] || [ -z "$AVORA_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secrets AVORA_KEYSTORE_BASE64 / AVORA_KEYSTORE_PASSWORD."
            exit 1
          fi
          printf '%s' "$AVORA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/avora-release.jks"
          echo "AVORA_KEYSTORE_PATH=$RUNNER_TEMP/avora-release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          AVORA_KEYSTORE_PASSWORD: ${{ secrets.AVORA_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature and that the APK is not debuggable
        env:
          EXPECTED_SHA256: ${{ vars.AVORA_CERT_SHA256 }}
        run: |
          APK=$(ls "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::The APK is debuggable."
            exit 1
          fi
          echo "OK: not debuggable"
          ACTUAL=$(grep -m1 "certificate SHA-256 digest" "$RUNNER_TEMP/cert.txt" | sed 's/.*: *//' | tr 'a-f' 'A-F')
          echo "Certificate SHA-256: $ACTUAL"
          if [ -n "$EXPECTED_SHA256" ]; then
            WANT=$(echo "$EXPECTED_SHA256" | tr -d ': ' | tr 'a-f' 'A-F')
            if [ "$ACTUAL" != "$WANT" ]; then
              echo "::error::Signing certificate does not match AVORA_CERT_SHA256. Wrong key?"
              exit 1
            fi
            echo "OK: certificate matches the expected one"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVORA-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
